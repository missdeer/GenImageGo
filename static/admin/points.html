<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>积分明细 - Image Go</title>
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--text-primary);
        }
        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            font-weight: 500;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-row select,
        .filter-row input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .filter-row input[type="date"] {
            min-width: 140px;
        }
        .amount-positive {
            color: #10b981;
            font-weight: 500;
        }
        .amount-negative {
            color: #ef4444;
            font-weight: 500;
        }
        .reason-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .summary-box {
            display: flex;
            gap: 24px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .summary-item {
            text-align: center;
        }
        .summary-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .summary-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .summary-value.positive {
            color: #10b981;
        }
        .summary-value.negative {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>
        <div class="admin-header">
            <h1>积分明细</h1>
        </div>

        <div class="admin-content">
            <div id="loading" class="loading">加载中...</div>
            <div id="error-message" class="error-message"></div>
            <div id="no-permission" class="no-permission" style="display:none;">
                <p>您没有权限访问此页面</p>
                <a href="/">返回首页</a>
            </div>

            <div id="main-content" style="display:none;">
                <div class="tabs" id="tabs-container"></div>

                <!-- 我的积分 Tab -->
                <div id="tab-my" class="tab-content">
                    <div class="filter-row">
                        <select id="my-reason-filter">
                            <option value="">全部类型</option>
                        </select>
                        <input type="date" id="my-start-date" title="开始日期">
                        <input type="date" id="my-end-date" title="结束日期">
                        <button class="btn-primary" id="my-search-btn">查询</button>
                    </div>
                    <table class="users-table" id="my-table">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>类型</th>
                                <th>变动</th>
                                <th>余额</th>
                                <th>说明</th>
                            </tr>
                        </thead>
                        <tbody id="my-tbody"></tbody>
                    </table>
                    <div id="my-pagination" class="pagination" style="display:none;">
                        <button id="my-prev-btn" class="btn-secondary" disabled>上一页</button>
                        <span id="my-page-info">第 1 页 / 共 1 页</span>
                        <button id="my-next-btn" class="btn-secondary" disabled>下一页</button>
                    </div>
                </div>

                <!-- 用户积分 Tab (超级管理员) -->
                <div id="tab-user" class="tab-content">
                    <div class="filter-row">
                        <input type="text" id="user-search-keyword" placeholder="搜索用户邮箱...">
                        <select id="user-select" style="min-width:200px;">
                            <option value="">选择用户...</option>
                        </select>
                        <select id="user-reason-filter">
                            <option value="">全部类型</option>
                        </select>
                        <input type="date" id="user-start-date" title="开始日期">
                        <input type="date" id="user-end-date" title="结束日期">
                        <button class="btn-primary" id="user-search-btn">查询</button>
                    </div>
                    <table class="users-table" id="user-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>类型</th>
                                <th>变动</th>
                                <th>余额</th>
                                <th>说明</th>
                            </tr>
                        </thead>
                        <tbody id="user-tbody"></tbody>
                    </table>
                    <div id="user-pagination" class="pagination" style="display:none;">
                        <button id="user-prev-btn" class="btn-secondary" disabled>上一页</button>
                        <span id="user-page-info">第 1 页 / 共 1 页</span>
                        <button id="user-next-btn" class="btn-secondary" disabled>下一页</button>
                    </div>
                    <div id="user-empty" class="empty-message" style="display:none;">请先选择用户</div>
                </div>

                <!-- 组织积分 Tab -->
                <div id="tab-org" class="tab-content">
                    <div class="filter-row">
                        <select id="org-select" style="min-width:200px;">
                            <option value="">选择组织...</option>
                        </select>
                        <select id="org-reason-filter">
                            <option value="">全部类型</option>
                        </select>
                        <input type="date" id="org-start-date" title="开始日期">
                        <input type="date" id="org-end-date" title="结束日期">
                        <button class="btn-primary" id="org-search-btn">查询</button>
                    </div>
                    <table class="users-table" id="org-table" style="display:none;">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>类型</th>
                                <th>变动</th>
                                <th>余额</th>
                                <th>说明</th>
                            </tr>
                        </thead>
                        <tbody id="org-tbody"></tbody>
                    </table>
                    <div id="org-pagination" class="pagination" style="display:none;">
                        <button id="org-prev-btn" class="btn-secondary" disabled>上一页</button>
                        <span id="org-page-info">第 1 页 / 共 1 页</span>
                        <button id="org-next-btn" class="btn-secondary" disabled>下一页</button>
                    </div>
                    <div id="org-empty" class="empty-message" style="display:none;">请先选择组织</div>
                </div>
            </div>
        </div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/admin/points.js"></script>
</body>
</html>
