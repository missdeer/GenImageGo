<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组织管理 - Image Go</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="admin-container">
        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>
        <div class="admin-header">
            <h1>组织管理</h1>
        </div>

        <div class="admin-toolbar">
            <div class="search-box">
                <input type="text" id="search-keyword" placeholder="搜索组织名称...">
                <button id="search-btn" class="btn-primary">搜索</button>
            </div>
            <div id="create-org-wrapper" style="display:none;">
                <button id="create-org-btn" class="btn-primary" style="background:#10b981;">创建组织</button>
            </div>
        </div>

        <div class="admin-content">
            <div id="loading" class="loading">加载中...</div>
            <div id="error-message" class="error-message"></div>
            <div id="no-permission" class="no-permission" style="display:none;">
                <p>您没有权限访问此页面</p>
                <a href="/">返回首页</a>
            </div>

            <table id="orgs-table" class="users-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>组织名称</th>
                        <th>剩余积分</th>
                        <th>成员数</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="orgs-tbody">
                </tbody>
            </table>

            <div id="pagination" class="pagination" style="display:none;">
                <button id="prev-btn" class="btn-secondary" disabled>上一页</button>
                <span id="page-info">第 1 页 / 共 1 页</span>
                <button id="next-btn" class="btn-secondary" disabled>下一页</button>
            </div>
        </div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
    </div>

    <!-- 创建组织弹窗 -->
    <div id="create-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3>创建组织</h3>
                <span class="admin-modal-close" onclick="closeCreateModal()">&times;</span>
            </div>
            <div class="admin-modal-body">
                <label for="create-name">组织名称:</label>
                <input type="text" id="create-name" style="width:100%; padding:8px; margin-top:8px; margin-bottom:16px;">
                <label for="create-points">初始积分:</label>
                <input type="number" id="create-points" min="0" value="0" style="width:100%; padding:8px; margin-top:8px;">
            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closeCreateModal()">取消</button>
                <button class="btn-primary" onclick="submitCreateOrg()" style="background:#10b981;">创建</button>
            </div>
        </div>
    </div>

    <!-- 修改积分弹窗 -->
    <div id="points-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3>修改组织积分</h3>
                <span class="admin-modal-close" onclick="closePointsModal()">&times;</span>
            </div>
            <div class="admin-modal-body">
                <p>组织: <span id="points-modal-name"></span></p>
                <label for="points-input">积分:</label>
                <input type="number" id="points-input" min="0" style="width:100%; padding:8px; margin-top:8px;">
            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closePointsModal()">取消</button>
                <button class="btn-primary" onclick="submitUpdatePoints()">确定</button>
            </div>
        </div>
    </div>

    <!-- 修改名称弹窗 -->
    <div id="name-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3>修改组织名称</h3>
                <span class="admin-modal-close" onclick="closeNameModal()">&times;</span>
            </div>
            <div class="admin-modal-body">
                <p>当前名称: <span id="name-modal-current"></span></p>
                <label for="name-input">新名称:</label>
                <input type="text" id="name-input" style="width:100%; padding:8px; margin-top:8px;">
            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closeNameModal()">取消</button>
                <button class="btn-primary" onclick="submitUpdateName()">确定</button>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div id="confirm-modal" class="admin-modal" style="display:none;">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3 id="confirm-modal-title">确认</h3>
                <span class="admin-modal-close" onclick="closeConfirmModal()">&times;</span>
            </div>
            <div class="admin-modal-body">
                <p id="confirm-modal-message"></p>
            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closeConfirmModal()">取消</button>
                <button id="confirm-modal-btn" class="btn-primary" onclick="confirmAction()">确定</button>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/admin/organizations.js"></script>
</body>
</html>
