<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点管理 - Image Go</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/admin.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="admin-container">
        <a href="/" class="back-link">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            返回首页
        </a>
        <div class="admin-header">
            <h1>站点管理</h1>
        </div>

        <div class="admin-content">
            <div id="loading" class="loading">加载中...</div>
            <div id="error-message" class="error-message"></div>
            <div id="no-permission" class="no-permission" style="display:none;">
                <p>您没有权限访问此页面</p>
                <a href="/">返回首页</a>
            </div>

            <div id="config-form" style="display:none;">
                <h2 class="config-section-title">积分配置</h2>
                <div id="config-items" class="config-items"></div>
            </div>

            <div id="user-settings" class="config-section" style="display:none; margin-top: 32px;">
                <h2 class="config-section-title">用户设置</h2>

                <div class="config-item-block">
                    <label class="config-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="vertical-align: middle; margin-right: 4px;">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        对话上下文
                    </label>
                    <div class="setting-box">
                        <label class="setting-toggle">
                            <input type="checkbox" id="context-toggle">
                            <span>启用对话上下文（AI可记住历史对话）</span>
                        </label>
                        <div class="setting-row">
                            <label class="setting-label">保留条数：</label>
                            <select id="context-count" class="setting-select">
                                <option value="3">最近 3 条对话</option>
                                <option value="5" selected>最近 5 条对话</option>
                                <option value="10">最近 10 条对话</option>
                                <option value="20">最近 20 条对话</option>
                            </select>
                        </div>
                        <div class="setting-hint">
                            启用后，AI可以基于之前的对话和图片继续创作<br>
                            保留条数越多，消耗的 Token 越多
                        </div>
                    </div>
                </div>

                <div id="auto-save-section" class="config-item-block">
                    <label class="config-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="vertical-align: middle; margin-right: 4px;">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                            <polyline points="17 21 17 13 7 13 7 21"></polyline>
                            <polyline points="7 3 7 8 15 8"></polyline>
                        </svg>
                        自动保存到本地
                    </label>
                    <div class="setting-box">
                        <label class="setting-toggle">
                            <input type="checkbox" id="auto-save-toggle">
                            <span>启用自动保存（不占用浏览器空间）</span>
                        </label>
                        <button class="btn-secondary" onclick="FileSystemManager.selectDirectory()" style="width: 100%; margin: 8px 0;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                style="vertical-align: middle; margin-right: 4px;">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                            </svg>
                            选择保存目录
                        </button>
                        <div id="selected-dir-path" class="dir-path-display" style="display: none;">
                            <strong>当前目录：</strong><span id="dir-path-text">未选择</span>
                        </div>
                        <div class="setting-hint">
                            启用后，生成的图片将自动保存到选择的目录<br>
                            需要支持 File System Access API 的浏览器（Chrome、Edge、Brave 等）
                        </div>
                    </div>
                </div>
            </div>

            <div id="config-actions" class="config-actions" style="display:none; margin-top: 32px;">
                <button id="save-btn" class="btn-primary" onclick="saveConfigs()">保存配置</button>
                <span id="save-status" class="save-status"></span>
            </div>
        </div>
    </div>

    <div class="theme-toggle" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/tools/filesystem.js"></script>
    <script src="../js/admin/site.js"></script>
</body>
</html>
