    <!-- Browser Compatibility Check -->
    <script>
        (function () {
            // Check if browser is Chromium-based
            // Chromium browsers have window.chrome object (Chrome, Edge, Opera, etc.)
            // We also check for the V8 engine via window.Intl.v8BreakIterator
            var isChromium = !!window.chrome ||
                (navigator.userAgent.indexOf('Chrome') > -1 && navigator.userAgent.indexOf('Safari') > -1) ||
                (navigator.userAgent.indexOf('Edg') > -1);

            // Exclude obvious non-Chromium browsers
            var isFirefox = navigator.userAgent.indexOf('Firefox') > -1;
            var isSafari = navigator.userAgent.indexOf('Safari') > -1 && navigator.userAgent.indexOf('Chrome') === -1;

            if (!isChromium || isFirefox || isSafari) {
                document.addEventListener('DOMContentLoaded', function () {
                    // Check if user already dismissed the warning
                    if (sessionStorage.getItem('browserWarningDismissed')) return;

                    var banner = document.createElement('div');
                    banner.className = 'browser-warning';
                    banner.id = 'browser-warning';
                    banner.innerHTML = '推荐使用 Chrome 或 Edge 浏览器，以获得更好的运行效果' +
                        '<button class="browser-warning-close" onclick="this.parentElement.remove();sessionStorage.setItem(\'browserWarningDismissed\',\'1\')" aria-label="关闭">×</button>';
                    document.body.insertBefore(banner, document.body.firstChild);
                });
            }
        })();
    </script>
