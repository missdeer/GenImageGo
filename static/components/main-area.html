        <div class="desktop-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="left-sidebar-toggle" class="sidebar-toggle-btn" title="切换左侧栏" onclick="toggleLeftSidebarDesktop()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </div>
                <div class="brand-area">
                    <img alt="ImageGo" src="/favicon.svg" width="24" height="24"/>
                <span>Image Go</span>
            </div>
            </div>
            <div class="header-actions">
                <div class="header-icon-btn" title="新建对话" onclick="createNewSession()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <div class="header-icon-btn" id="theme-toggle-btn" title="切换暗黑模式" onclick="toggleTheme()">
                    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </div>
                <div class="user-menu-container">
                    <div class="user-avatar-btn" onclick="toggleUserMenu(event)" title="用户菜单">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M20 21a8 8 0 1 0-16 0"></path>
                        </svg>
                    </div>
                    <div class="user-dropdown">
                        <div class="user-dropdown-header">
                            <div class="user-dropdown-email"></div>
                        </div>
                        <div class="user-dropdown-divider"></div>
                        <div class="user-dropdown-item" data-action="show-user-profile">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M20 21a8 8 0 1 0-16 0"></path>
                            </svg>
                            <span>个人资料</span>
                        </div>
                        <div class="user-dropdown-item user-dropdown-logout" data-action="logout">
                            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                <polyline points="16 17 21 12 16 7"></polyline>
                                <line x1="21" y1="12" x2="9" y2="12"></line>
                            </svg>
                            <span>退出登录</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chat-history">
            <div class="empty-state" id="empty-state">
                <img alt="ImageGo" src="/favicon.svg" width="48" height="48"/>
                <h1>Image Go</h1>
                <p>提示词优化 · 4K 渲染 · 本地存储</p>
            </div>
        </div>

        <div class="input-container-outer">
            <div class="preview-area" id="preview-area"></div>
            <div class="input-wrapper">
                <input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this.files)">
                <div class="textarea-wrapper">
                    <textarea id="user-input" placeholder="描述画面..." rows="2"></textarea>
                    <div class="icon-btn clear-btn" id="clear-btn" title="清空输入" onclick="clearInput()" role="button" tabindex="-1" aria-label="清空输入" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </div>
                </div>
                <div class="input-actions">
                    <div class="icon-btn" title="上传参考图" onclick="document.getElementById('file-input').click()">
                        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" fill="none" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <div class="icon-btn" id="banana-btn" title="提示词快查" onclick="BananaTool.open()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" style="color:#d97706;">
                            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                        </svg>
                    </div>
                    <div class="resolution-dropdown" id="resolution-dropdown">
                        <div class="resolution-btn" id="resolution-btn" onclick="toggleResolutionMenu(event)">
                            <span id="resolution-text">4K</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="resolution-menu" id="resolution-menu">
                            <div class="resolution-option" data-val="1024x1024" onclick="selectResolution('1024x1024', '1K')">1K</div>
                            <div class="resolution-option" data-val="2048x2048" onclick="selectResolution('2048x2048', '2K')">2K</div>
                            <div class="resolution-option active" data-val="4K" onclick="selectResolution('4K', '4K')">4K</div>
                        </div>
                    </div>
                    <div class="resolution-dropdown" id="aspect-ratio-dropdown">
                        <div class="resolution-btn" id="aspect-ratio-btn" onclick="toggleAspectRatioMenu(event)">
                            <span id="aspect-ratio-text">Auto</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="resolution-menu aspect-ratio-menu" id="aspect-ratio-menu">
                            <div class="resolution-option active" data-val="auto" onclick="selectAspectRatio('auto', 'Auto')">Auto</div>
                            <div class="resolution-option" data-val="21:9" onclick="selectAspectRatio('21:9', '21:9')">21:9</div>
                            <div class="resolution-option" data-val="16:9" onclick="selectAspectRatio('16:9', '16:9')">16:9</div>
                            <div class="resolution-option" data-val="3:2" onclick="selectAspectRatio('3:2', '3:2')">3:2</div>
                            <div class="resolution-option" data-val="4:3" onclick="selectAspectRatio('4:3', '4:3')">4:3</div>
                            <div class="resolution-option" data-val="1:1" onclick="selectAspectRatio('1:1', '1:1')">1:1</div>
                            <div class="resolution-option" data-val="3:4" onclick="selectAspectRatio('3:4', '3:4')">3:4</div>
                            <div class="resolution-option" data-val="2:3" onclick="selectAspectRatio('2:3', '2:3')">2:3</div>
                            <div class="resolution-option" data-val="9:16" onclick="selectAspectRatio('9:16', '9:16')">9:16</div>
                        </div>
                    </div>
                    <div class="input-actions-spacer"></div>
                    <div class="icon-btn enhance-btn" id="enhance-btn" title="优化提示词" onclick="enhancePrompt()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                    </div>
                    <div class="icon-btn send-btn" id="send-btn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
