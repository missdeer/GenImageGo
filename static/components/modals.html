    <!-- Banana Prompt Modal -->
    <div id="banana-modal" class="banana-dialog-overlay">
        <div class="banana-dialog">
            <div class="banana-dialog-header">
                <div class="banana-dialog-title">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="color:#d97706;">
                        <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                    </svg>
                    <span>提示词快查</span>
                    <a href="https://github.com/glidea/banana-prompt-quicker" target="_blank" class="banana-github-link">
                        <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
                            <path
                                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                            </path>
                        </svg>
                        <span>GitHub</span>
                    </a>
                </div>
                <div class="banana-dialog-close" onclick="BananaTool.close()" title="关闭">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </div>
            </div>
            <div class="banana-dialog-body">
                <div class="banana-search-wrapper">
                    <svg class="banana-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="banana-search-input" placeholder="搜索关键词 (标题、提示词、分类)..."
                        oninput="BananaTool.handleSearch(this.value)">
                </div>
                <div class="banana-tabs">
                    <div class="banana-tab active" onclick="BananaTool.filter('all', this)">全部</div>
                    <div class="banana-tab" onclick="BananaTool.filter('generate', this)">绘图</div>
                    <div class="banana-tab" onclick="BananaTool.filter('edit', this)">生活</div>
                    <div class="banana-tab" onclick="BananaTool.filter('nsfw', this)">NSFW</div>
                    <div class="banana-tab" onclick="BananaTool.filter('study', this)">学习</div>
                    <div class="banana-tab" onclick="BananaTool.filter('work', this)">工作</div>
                </div>
                <div id="banana-loading" style="text-align:center; padding:40px; color:#666;">
                    <div class="loading-spinner" style="margin:0 auto 10px auto;"></div>
                    正在获取最新提示词...
                </div>
                <div id="banana-error" style="text-align:center; padding:40px; color:#d93025; display:none;">
                    获取失败，请检查网络连接
                    <br><button class="config-btn" onclick="BananaTool.fetchData()"
                        style="margin-top:10px; width:auto; padding:6px 20px;">重试</button>
                </div>
                <div id="banana-grid" class="banana-grid"></div>
            </div>
        </div>
    </div>

    <!-- Custom Prompt Modal -->
    <div id="custom-prompt-modal" class="xhs-modal">
        <div class="slice-header-bar">
            <a href="/" class="slice-back-link" onclick="CustomPromptTool.close(); return false;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                返回首页
            </a>
            <div class="slice-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="color:#9333ea;">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                <span>我的提示词</span>
            </div>
            <div class="slice-header-spacer"></div>
        </div>
        <div
            style="flex: 1; display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; width: 100%; padding: 24px; overflow-y: auto; padding-top: 80px;">
            <!-- 添加/编辑区域 -->
            <div
                style="background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; margin-bottom: 24px;">
                <div
                    style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    <span id="custom-prompt-form-title">新建提示词</span>
                </div>
                <input type="hidden" id="custom-prompt-edit-id" value="">
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">标题</label>
                    <input type="text" id="custom-prompt-title" class="xhs-input" placeholder="例如：人物肖像生成"
                        style="margin-bottom: 0;">
                </div>
                <div style="margin-bottom: 12px;">
                    <label style="display: block; font-size: 12px; color: #666; margin-bottom: 6px;">提示词内容</label>
                    <textarea id="custom-prompt-content" class="xhs-textarea-lg" placeholder="输入你的提示词内容..."
                        style="min-height: 80px; border: 1px solid #dadce0; border-radius: 6px; padding: 10px;"></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="config-btn primary" style="flex: 1;" onclick="CustomPromptTool.save()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                            <polyline points="17 21 17 13 7 13 7 21" />
                            <polyline points="7 3 7 8 15 8" />
                        </svg>
                        保存
                    </button>
                    <button class="config-btn" style="flex: 1;" onclick="CustomPromptTool.clearForm()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        清空
                    </button>
                </div>
            </div>

            <!-- 搜索框 -->
            <div class="banana-search-wrapper" style="margin-bottom: 20px;">
                <svg class="banana-search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="banana-search-input" placeholder="搜索提示词..."
                    oninput="CustomPromptTool.handleSearch(this.value)">
            </div>

            <!-- 提示词列表 -->
            <div id="custom-prompt-list" class="banana-grid"></div>
            <div id="custom-prompt-empty" style="text-align:center; padding:60px 20px; color:#999; display:none;">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    style="margin:0 auto 16px; opacity:0.3;">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                <div style="font-size: 14px; margin-bottom: 8px;">还没有保存的提示词</div>
                <div style="font-size: 12px; color: #aaa;">在上方添加你的常用提示词</div>
            </div>
        </div>
    </div>

    <!-- Slicer Modal -->
    <div id="slice-modal">
        <div class="slice-header-bar">
            <a href="/" class="slice-back-link" onclick="SlicerTool.close(); return false;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                返回首页
            </a>
            <div class="slice-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="6" cy="6" r="3" />
                    <circle cx="6" cy="18" r="3" />
                    <line x1="20" y1="4" x2="8.12" y2="15.88" />
                    <line x1="14.47" y1="14.48" x2="20" y2="20" />
                    <line x1="8.12" y1="8.12" x2="12" y2="12" />
                </svg>
                图片分割工厂
            </div>
            <div class="slice-header-spacer"></div>
        </div>
        <div class="slice-scroll-area">
            <div class="slice-toolbar">
                <input type="file" id="slice-file-input" accept="image/*" style="display:none"
                    onchange="SlicerTool.handleFile(this.files)">
                <button class="slice-action-btn secondary"
                    onclick="document.getElementById('slice-file-input').click()">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="17 8 12 3 7 8" />
                        <line x1="12" y1="3" x2="12" y2="15" />
                    </svg>
                    更换图片
                </button>
                <div class="slice-btn-group">
                    <label class="radio-label active" onclick="SlicerTool.setMode('horizontal', this)"><input
                            type="radio" name="slice-mode" value="horizontal" checked> <span>横线 —</span></label>
                    <label class="radio-label" onclick="SlicerTool.setMode('vertical', this)"><input type="radio"
                            name="slice-mode" value="vertical"> <span>竖线 |</span></label>
                </div>
                <div class="slice-btn-group">
                    <label class="radio-label" style="display:flex; align-items:center; gap:4px;"><input type="checkbox"
                            id="slice-force-square" style="margin:0;"> <span>1:1 补全</span></label>
                    <div id="slice-color-picker-box" style="display:none; align-items: center; padding: 0 8px;">
                        <input type="color" id="slice-bg-color" value="#ffffff"
                            style="width:24px; height:24px; padding:0; border:none; cursor:pointer;">
                    </div>
                </div>
                <button class="slice-action-btn secondary" id="slice-clear-btn">清空辅助线</button>
                <button class="slice-action-btn primary" id="slice-process-btn" disabled>⚡ 生成切片</button>
                <button class="slice-action-btn download-all" id="slice-download-all-btn" disabled
                    onclick="SlicerTool.downloadAll()">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    一键打包下载
                </button>
            </div>
            <div id="slice-editor-container">
                <div id="slice-empty-msg" onclick="document.getElementById('slice-file-input').click()">
                    <div style="margin-bottom:10px;">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#dadce0" stroke-width="1.5">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z">
                            </path>
                        </svg>
                    </div>
                    <div>点击上传本地图片</div>
                </div>
                <img id="slice-source-image" src="" alt="Source" style="display:none;" crossorigin="anonymous">
                <div id="slice-overlay-canvas"></div>
            </div>
            <div id="slice-result-grid"></div>
        </div>
    </div>
