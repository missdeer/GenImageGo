<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - Image Go</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Image Go</h1>
                <p>重置您的密码</p>
            </div>
            <form id="forgot-form" class="auth-form">
                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="请输入注册邮箱地址">
                </div>
                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>
                <button type="submit" class="auth-button" id="submit-btn">
                    <span class="btn-text">发送重置链接</span>
                    <span class="btn-loading" style="display:none;">发送中...</span>
                </button>
            </form>
            <div class="auth-footer">
                <p>想起密码了？<a href="/login">返回登录</a></p>
            </div>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            hideError();
        }

        function hideSuccess() {
            document.getElementById('success-message').style.display = 'none';
        }

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            hideSuccess();
            setLoading(true);

            const email = document.getElementById('email').value.trim();

            try {
                const resp = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await resp.json();

                if (resp.ok) {
                    showSuccess('如果该邮箱已注册，您将收到一封包含重置密码链接的邮件。');
                    document.getElementById('email').value = '';
                } else {
                    showError(data.error || '请求失败');
                }
            } catch (e) {
                showError('网络错误，请重试');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
