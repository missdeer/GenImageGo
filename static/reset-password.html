<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - Image Go</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Image Go</h1>
                <p>设置新密码</p>
            </div>
            <div id="loading-state" style="text-align: center; padding: 20px;">
                <p>验证链接中...</p>
            </div>
            <div id="invalid-state" style="display: none; text-align: center; padding: 20px;">
                <p id="invalid-message" style="color: var(--text-sub); margin-bottom: 20px;"></p>
                <a href="/forgot-password.html" class="auth-button" style="display: inline-block; text-decoration: none;">重新发送重置链接</a>
            </div>
            <form id="reset-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" id="email" disabled style="background: var(--hover-color);">
                </div>
                <div class="form-group">
                    <label for="password">新密码</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="至少6位，含大小写字母和数字">
                </div>
                <div class="form-group">
                    <label for="confirm-password">确认新密码</label>
                    <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" placeholder="再次输入新密码">
                </div>
                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>
                <button type="submit" class="auth-button" id="submit-btn">
                    <span class="btn-text">重置密码</span>
                    <span class="btn-loading" style="display:none;">重置中...</span>
                </button>
            </form>
            <div class="auth-footer">
                <p>想起密码了？<a href="/login.html">返回登录</a></p>
            </div>
        </div>
        <div class="theme-toggle" onclick="toggleTheme()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5"></circle>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            hideError();
        }

        function hideSuccess() {
            document.getElementById('success-message').style.display = 'none';
        }

        function showInvalid(msg) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('reset-form').style.display = 'none';
            document.getElementById('invalid-state').style.display = 'block';
            document.getElementById('invalid-message').textContent = msg;
        }

        function showForm(email) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('invalid-state').style.display = 'none';
            document.getElementById('reset-form').style.display = 'flex';
            document.getElementById('email').value = email;
        }

        async function validateToken() {
            if (!token) {
                showInvalid('缺少重置令牌，请通过邮件中的链接访问此页面。');
                return;
            }

            try {
                const resp = await fetch('/api/auth/validate-reset-token?token=' + encodeURIComponent(token));
                const data = await resp.json();

                if (resp.ok && data.valid) {
                    showForm(data.email);
                } else {
                    showInvalid(data.error || '重置链接无效或已过期');
                }
            } catch (e) {
                showInvalid('网络错误，请重试');
            }
        }

        validateToken();

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            hideSuccess();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password.length < 6) {
                showError('密码长度至少为 6 个字符');
                return;
            }

            if (!validatePasswordComplexity(password)) {
                showError('密码必须包含大写字母、小写字母和数字');
                return;
            }

            if (password !== confirmPassword) {
                showError('两次输入的密码不一致');
                return;
            }

            setLoading(true);

            try {
                const resp = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await resp.json();

                if (resp.ok) {
                    showSuccess('密码重置成功！正在跳转到登录页面...');
                    document.getElementById('submit-btn').disabled = true;
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    showError(data.error || '重置失败');
                }
            } catch (e) {
                showError('网络错误，请重试');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
